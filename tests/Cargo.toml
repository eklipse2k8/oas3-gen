[package]
name = "oas3-gen-tests"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autolib = false
autobins = false
autotests = false
autobenches = false
autoexamples = false

[[test]]
name = "oas3-gen"
path = "oas3-gen/main.rs"

[[test]]
name = "petstore-client"
path = "petstore-client/main.rs"

[[test]]
name = "petstore-server"
path = "petstore-server/main.rs"

[[bench]]
name = "sse"
path = "../benches/sse.rs"
harness = false

[[bench]]
name = "generate"
path = "../benches/generate.rs"
harness = false

[dev-dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["multipart"] }
bytes.workspace = true
chrono.workspace = true
criterion.workspace = true
futures.workspace = true
http.workspace = true
indexmap.workspace = true
inflections.workspace = true
mediatype.workspace = true
oas3.workspace = true
oas3-gen = { path = "../crates/oas3-gen" }
oas3-gen-support = { workspace = true, features = ["eventsource"] }
petstore-client = { path = "../fixtures/petstore-client" }
petstore-server = { path = "../fixtures/petstore-server" }
prettyplease.workspace = true
proc-macro2.workspace = true
proptest.workspace = true
quote.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["json", "multipart", "http2", "native-tls", "query", "stream"] }
rstest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }
toml = { workspace = true, features = ["parse"] }
uuid.workspace = true
validator.workspace = true
yaml_serde.workspace = true
