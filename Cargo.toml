[workspace]
resolver = "3"
members = [
  "crates/*",
  "crates/oas3-gen/fixtures/petstore-client",
  "crates/oas3-gen/fixtures/petstore-server",
]

[workspace.package]
version = "0.29.0"
authors = ["Matthew Jarjoura <eklipse2k8>"]
categories = [
  "command-line-utilities",
  "development-tools",
  "web-programming::http-client",
]
description = "A rust type generator for OpenAPI v3.1.x specification."
documentation = "https://eklipse2k8.github.io/oas3-gen/"
edition = "2024"
keywords = ["oas3", "json", "yaml", "openapi", "generator"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/eklipse2k8/oas3-gen"
rust-version = "1.89"

[profile.release]
codegen-units = 1
debug = true
debug-assertions = false
lto = "fat"
opt-level = 3
panic = "abort"
split-debuginfo = "packed"
strip = "symbols"

[profile.dev]
debug = true
debug-assertions = true
opt-level = 0
panic = "unwind"
split-debuginfo = "unpacked"

[workspace.dependencies]
# Workspace Members
oas3-gen-support = { path = "crates/oas3-gen-support", version = "0.29.0" }

# External Dependencies
any_ascii = { version = "0.3" }
anyhow = { version = "1.0" }
axum = { version = "0.8.5" }
axum-core = { version = "0.5" }
axum-extra = { version = "0.12", features = ["cookie"] }
better_default = { version = "1.0" }
blake3 = { version = "1.8", features = ["neon", "traits-preview"] }
bon = { version = "3.10", features = ["implied-bounds"] }
bytes = { version = "1.12" }
cfg-if = { version = "1.0" }
chrono = { version = ">=0.4.42", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive", "color"] }
comfy-table = { version = "8.0" }
criterion = { version = "0.8" }
crossterm = { version = "0.29", default-features = false }
cruet = { version = "1.0" }
fmmap = { version = "0.5", features = ["tokio"] }
futures = { version = "0.3" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3", default-features = false }
http = { version = "1.5" }
indexmap = { version = "2.14", features = ["serde"] }
inflections = { version = "1.1" }
itertools = { version = "0.15" }
json-canon = { version = "0.1" }
memchr = { version = "2.8" }
mediatype = { version = "0.23", features = ["serde"] }
num-format = { version = "0.4" }
oas3 = { version = "0.22", features = ["yaml-spec"] }
percent-encoding = { version = "2.3" }
petgraph = { version = "0.8" }
prettyplease = { version = "0.3" }
proc-macro2 = { version = "1.0" }
proptest = { version = "1.12" }
quick-xml = { version = ">=0.38", default-features = false }
quote = { version = "1.0" }
regex = { version = "1.13" }
reqwest = { version = "0.13", default-features = false }
reqwest_cookie_store = { version = "0.10" }
rstest = { version = "0.27" }
secrecy = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_html_form = { version = "0.4", default-features = false, features = ["ser", "std"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = { version = "0.1" }
serde_with = { version = "3.24", features = ["base64", "chrono"] }
string_cache = { version = "0.11", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3.0", features = ["full", "parsing"] }
tempfile = { version = "3.27" }
thiserror = { version = "2.0" }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "fs", "io-std", "io-util", "macros", "process"] }
toml = { version = "1.1.8+spec-1.1.0", default-features = false, features = ["display", "serde"] }
uuid = { version = "1.28", features = ["serde"] }
yaml_serde = { version = "0.10" }
validator = { version = "0.21" }

[patch.crates-io]
oas3-gen-support = { path = "crates/oas3-gen-support" }
