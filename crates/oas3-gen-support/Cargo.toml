[package]
name = "oas3-gen-support"
version.workspace = true
authors.workspace = true
categories.workspace = true
description = "Runtime support library for Rust code generated by oas3-gen."
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["quick-xml", "reqwest", "eventsource"]

reqwest = ["dep:reqwest"]

eventsource = ["reqwest", "dep:bytes", "dep:futures-core", "dep:futures-util", "dep:memchr"]

quick-xml = ["dep:quick-xml", "quick-xml/serde", "quick-xml/serialize"]

[dependencies]
better_default.workspace = true
bon.workspace = true
bytes = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
http.workspace = true
memchr = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_with.workspace = true
serde.workspace = true
thiserror.workspace = true
validator.workspace = true
